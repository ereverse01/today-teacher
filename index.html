<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘은 내가 선생님</title>
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: a teacher's planning desk on graph paper. Top = step rail, middle = the current step's sheet; in step 5 a fixed 50-minute frame of fill-in blocks sits left, the live check sheet right. */
:root{
  --paper:#f2f4f7; --grid:#e3e8ef; --card:#ffffff; --ink:#1c2230; --muted:#5b6476; --line:#d4dae3;
  --pen:#2546c9; --pen-ink:#ffffff;
  --ok:#1d8a5c; --warn:#b7791f; --bad:#c2384f;
  --s-open:#64748b; --s-model:#3563d6; --s-guided:#1f9566; --s-act:#c98a0c; --s-close:#7356c2;
  --slot:#ffffff;
  --display:'Do Hyeon','IBM Plex Sans KR','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --hand:'Nanum Pen Script','Gaegu',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151a23; --grid:#1d2430; --card:#1e2531; --ink:#e7ebf2; --muted:#9aa4b6; --line:#323b4b;
  --pen:#7d97ff; --pen-ink:#0f1630; --ok:#4fc58e; --warn:#e3b04f; --bad:#f07b8f;
  --s-open:#5f6f86; --s-model:#3d63c9; --s-guided:#1c8a5d; --s-act:#a8730b; --s-close:#6a4fb8; --slot:#141a24;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151a23; --grid:#1d2430; --card:#1e2531; --ink:#e7ebf2; --muted:#9aa4b6; --line:#323b4b;
  --pen:#7d97ff; --pen-ink:#0f1630; --ok:#4fc58e; --warn:#e3b04f; --bad:#f07b8f;
  --s-open:#5f6f86; --s-model:#3d63c9; --s-guided:#1c8a5d; --s-act:#a8730b; --s-close:#6a4fb8; --slot:#141a24;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.brand h1{font-size:34px;line-height:1.1}
[hidden]{display:none!important}
.brand .lede{color:var(--muted);font-size:14px}
.pen{font-family:var(--hand);color:var(--pen);font-size:22px;line-height:1.2}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px 6px 6px;font-size:13.5px;color:var(--muted)}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grid);font-size:12px;font-weight:700;color:var(--muted)}
.steps button[aria-current="step"]{border-color:var(--pen);color:var(--ink)}
.steps button[aria-current="step"] .n{background:var(--pen);color:var(--pen-ink)}
.steps button.done .n{background:color-mix(in srgb,var(--pen) 22%,var(--card));color:var(--pen)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.sheet-head{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--pen);font-weight:700}
.sheet-head h2{font-size:28px;line-height:1.2}
.sheet-head p{color:var(--muted);max-width:68ch}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 11px;font-size:13px;border-radius:8px}
.hint{color:var(--muted);font-size:13.5px}

/* step 1: topic cards */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ucard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.ucard:hover{border-color:var(--muted)}
.ucard[aria-pressed="true"]{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen) inset}
.ucard .fld{font-size:12px;color:var(--pen);font-weight:700;letter-spacing:.06em}
.ucard .t{font-family:var(--display);font-size:22px;line-height:1.2}
.ucard .q{font-size:13.5px;color:var(--muted);margin-top:auto}

/* step 2: outline */
.outline{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.topic{font-size:17px;font-weight:500;line-height:1.55}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:7px 0;position:relative}
.flow li .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--pen);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--pen);background:var(--card);position:relative;z-index:1}
.flow li:not(:last-child)::before{content:"";position:absolute;left:11px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.key{font-family:Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.7;background:var(--paper);border-radius:10px;padding:12px 14px}
.terms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.terms b{font-family:Georgia,'Times New Roman',serif;font-weight:700}

/* step 3/4: choice cards */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard:hover{border-color:var(--muted)}
.ccard[aria-pressed="true"]{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen) inset}
.ccard .t{font-weight:700;font-size:16px}
.ccard .en{font-size:12.5px;color:var(--muted)}
.ccard .src{font-size:12px;color:var(--pen);font-weight:500}
.ccard .d{font-size:13.5px;color:var(--muted)}
.pm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font-size:13.5px}
.pm .p{color:var(--ok)} .pm .m{color:var(--bad)}
.fit{font-size:13px;border-radius:8px;padding:6px 9px;margin-top:4px}
.fit.good{background:color-mix(in srgb,var(--ok) 13%,var(--card));color:var(--ok)}
.fit.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
.section{display:flex;flex-direction:column;gap:10px}
.section h3{font-size:21px}
.flip{animation:flip .5s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
input.name{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);max-width:220px}

/* step 5: fixed frame of fill-in blocks */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.frame{display:flex;flex-direction:column;gap:0;min-width:0}
.stage{--c:var(--s-open);display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.stage:not(:last-child)::before{content:"";position:absolute;left:36px;top:58px;bottom:0;width:3px;background:var(--line)}
.stage-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.stage-tab .mn{width:58px;height:50px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:19px;line-height:1;position:relative;z-index:1}
.stage-tab .mn small{font-family:var(--body);font-size:11px;display:block;margin-top:2px;opacity:.9}
.stage-tab .nm{font-family:var(--display);font-size:16px;color:var(--c);text-align:center;line-height:1.1;margin-top:4px}
.stage-tab .en{font-size:11px;color:var(--muted);font-style:italic;text-align:center}
.stage-tab .nm,.stage-tab .en{position:relative;z-index:1;background:var(--card);padding:0 3px}
.stage-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage-note{font-size:13px;color:var(--muted)}
.blk{--c:var(--s-open);position:relative;background:var(--c);color:#fff;border-radius:10px;padding:10px 12px 11px;display:flex;flex-direction:column;gap:6px;min-width:0}
.blk::before{content:"";position:absolute;left:20px;top:-1px;width:24px;height:6px;border-radius:0 0 6px 6px;background:var(--card)}
.blk .lbl{font-weight:700;font-size:13px;letter-spacing:.02em;opacity:.92}
.blk .line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14.5px;min-width:0}
.blk .line .w{white-space:normal}
.slot{flex:1 1 200px;min-width:0;border:none;border-radius:999px;background:var(--slot);color:var(--ink);padding:6px 14px;font-size:14px}
.slot.short{flex:0 1 140px}
.slot::placeholder{color:color-mix(in srgb,var(--muted) 85%,transparent)}
.slot.filled{box-shadow:0 0 0 2px rgba(255,255,255,.75)}
select.slot{flex:0 0 auto;padding-right:28px;border-radius:8px}
.order{display:flex;flex-direction:column;gap:5px}
.order .it{display:flex;align-items:center;gap:8px;background:var(--slot);color:var(--ink);border-radius:8px;padding:5px 6px 5px 10px;font-size:14px}
.order .it .k{font-weight:700;color:var(--c);min-width:16px}
.order .it span.tx{flex:1;min-width:0}
.mini{border:1px solid var(--line);background:var(--card);border-radius:6px;width:26px;height:24px;line-height:1;color:var(--ink)}
.mini:disabled{opacity:.35}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips button{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:2px 11px;font-size:13.5px}
.tchips button[aria-pressed="true"]{background:var(--slot);color:var(--ink);border-color:var(--slot);font-weight:700}
.checks{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px}
.checks h3{font-size:20px}
.meter{display:flex;flex-direction:column;gap:4px}
.bar{height:12px;border-radius:999px;background:var(--grid);overflow:hidden}
.bar span{display:block;height:100%;background:var(--pen);transition:width .3s}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.clist .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.st.ok{background:var(--ok)} .st.warn{background:var(--warn)} .st.wait{background:var(--line);color:var(--muted)}
.clist .ct{font-weight:700}
.clist .cd{color:var(--muted)}
.clist .src{color:var(--pen);font-size:12px}

/* step 6: plan */
.plan{border:1px solid var(--ink);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.plan-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.plan-h h3{font-size:26px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--paper);font-weight:700}
td.min{font-variant-numeric:tabular-nums;white-space:nowrap}
td .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
td .empty{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.modebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.teacher{border-color:var(--ink);font-weight:700}
.submit{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1.5px dashed var(--pen);border-radius:12px;padding:14px 16px}
.submit p{flex:1 1 260px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sub{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sub:hover{border-color:var(--pen)}
.sub .who{font-weight:700;font-size:15.5px}
.sub .acct{font-size:12px;color:var(--muted)}
.sub .tp{font-size:13.5px}
.sub .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.filter{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.copybox{width:100%;min-height:140px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}

@media (max-width:860px){
  .outline,.builder{grid-template-columns:minmax(0,1fr)}
  .checks{position:static}
  .brand h1{font-size:28px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .stage{grid-template-columns:minmax(0,1fr)}
  .stage:not(:last-child)::before{display:none}
  .stage-tab{flex-direction:row;gap:10px;align-items:center}
  .stage-tab .mn{width:auto;height:auto;padding:6px 10px;font-size:16px}
  .stage-tab .mn small{display:inline;margin:0 0 0 4px}
  .stage-tab .nm{margin:0}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>오늘은 내가 선생님</h1>
      <p class="lede">새로운 주제로 50분 수업을 직접 설계해 보기 · <span class="pen">"A good teacher is a combination of many abilities."</span></p>
    </div>
    <div class="modebar"><ol class="steps" id="steps"></ol></div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- content: new topics ---------- */
const TOPICS=[
{id:'bee',field:'생태',title:'꿀벌이 사라지면',
 goal:'꿀벌이 하는 일과 꿀벌이 줄어드는 이유를 설명할 수 있다.',
 points:['꿀벌은 꽃가루를 옮겨 식물이 열매를 맺게 한다 (pollinate)','우리가 먹는 과일과 채소의 상당수가 꽃가루를 옮기는 곤충에 기대고 있다','서식지 감소, 농약, 기후 변화 때문에 꿀벌이 줄고 있다'],
 key:'When bees disappear, many of the fruits and vegetables we eat disappear with them.',
 terms:[['pollinate','꽃가루를 옮기다'],['habitat','서식지'],['pesticide','농약'],['decline','감소하다']],
 hook:'오늘 아침에 먹은 것 중에 꿀벌 덕분에 생긴 음식이 있을까요?'},
{id:'sleep',field:'뇌과학',title:'잠이 기억을 만든다',
 goal:'잠이 기억에 어떤 역할을 하는지 설명할 수 있다.',
 points:['자는 동안 뇌는 낮에 배운 것을 정리해 오래 가는 기억으로 바꾼다 (consolidate)','밤을 새우면 공부한 내용이 제대로 저장되지 않는다','청소년에게는 하루 8~10시간의 잠이 권장된다'],
 key:'While you sleep, your brain is busy turning what you learned today into long-term memory.',
 terms:[['consolidate','굳히다, 강화하다'],['memory','기억'],['sleep-deprived','잠이 부족한'],['brain','뇌']],
 hook:'시험 전날 밤새 공부한 내용, 다음 날 얼마나 기억났나요?'},
{id:'bubble',field:'미디어',title:'추천 알고리즘과 필터 버블',
 goal:'필터 버블이 무엇인지 알고 벗어나는 방법을 말할 수 있다.',
 points:['앱은 내가 클릭한 것과 비슷한 것을 계속 추천한다 (algorithm)','그러다 보면 비슷한 정보와 생각만 보게 되는 필터 버블에 갇힌다','일부러 다른 관점을 찾아보면 버블에서 벗어날 수 있다'],
 key:'The more you click on something, the more the app shows you things just like it.',
 terms:[['algorithm','알고리즘'],['recommend','추천하다'],['filter bubble','필터 버블'],['perspective','관점']],
 hook:'친구와 내 유튜브 첫 화면은 얼마나 다를까요?'},
{id:'fashion',field:'환경·경제',title:'패스트 패션의 숨은 비용',
 goal:'패스트 패션의 문제와 그 대안을 설명할 수 있다.',
 points:['패스트 패션은 유행하는 옷을 싸고 빠르게 만들어 판다','옷을 만들 때 물이 많이 들고, 금방 버려진 옷은 쓰레기가 된다','오래 입기, 중고 거래, 수선이 대안이 될 수 있다'],
 key:'A cheap T-shirt may cost little at the store, but it costs a lot for the planet.',
 terms:[['trend','유행'],['waste','쓰레기, 낭비'],['secondhand','중고의'],['sustainable','지속 가능한']],
 hook:'옷장에 1년 동안 한 번도 안 입은 옷이 몇 벌 있나요?'},
{id:'star',field:'천문',title:'별빛은 과거에서 온다',
 goal:'우리가 보는 별빛이 과거의 빛인 이유를 설명할 수 있다.',
 points:['빛도 이동하는 데 시간이 걸린다','지금 보는 햇빛은 약 8분 전에 태양을 떠난 빛이다','아주 먼 별의 빛은 수천 년 전에 출발해서, 그 별은 지금 없을 수도 있다'],
 key:'When you look at the stars, you are looking into the past.',
 terms:[['light-year','광년'],['distance','거리'],['travel','이동하다'],['past','과거']],

const STEPS=['주제 고르기','골자 보기','우리 반과 나','활동 고르기','수업 코딩','지도안 완성'];

/* ---------- state ---------- */
const KEY='teacher-lesson-v2';
function blank(){return{step:0,topic:null,no:'',submittedAt:null,name:'',strengths:[],cls:null,act:null,v:{},order:[0,1,2],terms:[]}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const T=()=>TOPICS.find(t=>t.id===S.topic);
const A=()=>ACTS.find(a=>a.id===S.act);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1800)}
function canGo(i){if(i===0)return true;if(!S.topic)return false;if(i>=4)return !!S.act;return true}
function go(i){if(!canGo(i)){toast(S.topic?'활동을 하나 골라 주세요':'먼저 주제를 골라 주세요');return}S.step=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderSteps(){$('#steps').innerHTML=STEPS.map((s,i)=>`<li><button data-go="${i}" ${i===S.step?'aria-current="step"':''} class="${i<S.step?'done':''}"><span class="n">${i+1}</span>${s}</button></li>`).join('')}
function nav(prev,next,dis){return `<div class="navrow">${S.step>0?`<button class="btn" data-go="${S.step-1}">← ${prev}</button>`:'<span></span>'}${next?`<button class="btn primary" data-go="${S.step+1}" ${dis?'disabled':''}>${next} →</button>`:''}</div>`}
function head(eb,t,p){return `<div class="sheet-head"><span class="eyebrow">${eb}</span><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div>`}

 return `<section class="sheet">${head('STEP 1','가르치고 싶은 주제를 고르세요','교과서 밖의 새로운 주제 여덟 개예요. 친구들에게 가장 재미있게 설명할 수 있을 것 같은 주제를 골라 보세요.')}
 <div class="units">${TOPICS.map(t=>`<button class="ucard" data-topic="${t.id}" aria-pressed="${S.topic===t.id}"><span class="fld">${t.field}</span><span class="t">${esc(t.title)}</span><span class="q">${esc(t.hook)}</span></button>`).join('')}</div>
 ${nav('','골자 보기',!S.topic)}</section>`;
}

/* ---------- checks ---------- */
function slots(){const F=frame(A(),T());const out=[];F.forEach(st=>st.blocks.forEach(b=>(b.parts||[]).forEach(p=>{if(typeof p==='object'&&!p.opts)out.push({st,b,p})})));return out}
function val(k,p){return S.v[k]??(p&&p.opts?p.opts[0]:'')}
function runChecks(){
 const F=frame(A(),T()),sl=slots(),filled=sl.filter(x=>(S.v[x.p.k]||'').trim()).length,list=[];
 F.forEach(st=>{const mine=sl.filter(x=>x.st.id===st.id),empty=mine.filter(x=>!(S.v[x.p.k]||'').trim());
  list.push(empty.length?{s:'warn',t:`${st.nm}: 빈칸 ${empty.length}개`,d:empty.map(x=>x.b.lbl).join(', ')}:{s:'ok',t:`${st.nm}: 다 채웠어요`,d:''})});
 if(S.terms.length!==2)list.push({s:'warn',t:'칠판 단어를 두 개 골라 주세요',d:`지금 ${S.terms.length}개`,src:'시범 단계'});
 const pas=(S.v.passion||'').trim();
 list.push(pas.length>=5?{s:'ok',t:'열정 한마디로 시작해요',d:'청중이 눈을 떼지 못할 거예요.',src:'7번 expressiveness'}:{s:'warn',t:'열정 한마디가 아직 없어요',d:'왜 이 주제를 가르치고 싶은지 한 문장만 써 보세요.',src:'7번 expressiveness'});
 const cls=CLASSES.find(c=>c.id===S.cls),a=A();
 if(cls){
  const iss=[];
  a.rules.filter(r=>r.cls===cls.id&&val(a.id+'.'+r.k,{opts:[1]})===r.v).forEach(r=>iss.push(r.msg));
  if(cls.id==='basic'&&val('hintType',{opts:['단어 상자']})==='예시 답')iss.push('단어부터 막히는 반에는 "단어 상자"나 "문장 첫머리"가 더 도움이 돼요.');
  list.push(iss.length?{s:'warn',t:'우리 반과 맞지 않는 부분',d:iss.join(' '),src:'8번 class conditions · '+cls.t}:{s:'ok',t:'우리 반과 잘 어우러져요',d:cls.t,src:'8번 class conditions'});
 }else list.push({s:'wait',t:'우리 반 조건을 고르지 않았어요',d:'3단계에서 고르면 궁합을 점검해 줘요.',src:'8번 class conditions'});
 return{filled,total:sl.length,list};
}

  <div class="meter"><div class="lbl"><span>채운 칸</span><span>${r.filled} / ${r.total}</span></div><div class="bar"><span style="width:${r.total?r.filled/r.total*100:0}%"></span></div></div>

  const row={no,student:name,topic:t.title,act:a.t,cls:cls?cls.t:'',filled:r.filled+' / '+r.total,text:planText(),state:st,submittedAt:at};
  if(SHEET_URL){const res=await call({action:'save',row});if(!res.ok)throw new Error(res.error)}
  else saveLocalSubs([...localSubs().filter(x=>x.no!==no),row]);
  S.submittedAt=at;save();render();toast('선생님께 제출했어요')}
 catch(e){btn.disabled=false;btn.textContent='다시 시도';toast('제출하지 못했어요. 잠시 뒤 다시 눌러 주세요')}
}

/* ---------- render & events ---------- */
function render(){
 $('#steps').hidden=R.teacher;
 if(R.teacher){$('#main').innerHTML=vTeacher();if(!R.authed)$('#tpw')?.focus();return}
 renderSteps();$('#main').innerHTML=[vStep0,vStep1,vStep2,vStep3,vStep4,vStep5][S.step]();renderChecks()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.open){R.open=d.open;render();window.scrollTo({top:0});return}
 if(b.id==='back'){R.open=null;render();return}
 if(b.id==='trefresh'){b.disabled=true;b.textContent='불러오는 중…';tLoad().then(()=>{render();toast('새로 불러왔어요')}).catch(()=>{render();toast('불러오지 못했어요')});return}
 if(b.id==='tdel'){if(d.sure)tDelete(d.no);else{d.sure='1';b.textContent='한 번 더 누르면 지워져요'}return}
 if(b.id==='submit'){submitPlan(b);return}
 if(R.teacher)return;
 if(d.go!==undefined){go(+d.go);return}
 if(d.topic){if(S.topic!==d.topic){S.topic=d.topic;S.order=[0,1,2];S.terms=[];['hook','example','demo','hint','exit','take'].forEach(k=>delete S.v[k])}save();render();return}
 if(d.cls){S.cls=S.cls===d.cls?null:d.cls;save();render();return}
 if(d.str){const i=S.strengths.indexOf(d.str);if(i>=0)S.strengths.splice(i,1);else{if(S.strengths.length>=2){toast('강점은 두 가지만 고를 수 있어요');return}S.strengths.push(d.str)}save();render();return}
 if(d.act){S.act=d.act;save();render();return}
 if(b.id==='draw'){const c=CLASSES[Math.floor(Math.random()*CLASSES.length)];S.cls=c.id;save();render();document.querySelector(`[data-cls="${c.id}"]`)?.classList.add('flip');toast('우리 반: '+c.t);return}
 if(d.ord!==undefined){const i=+d.ord,j=i+ +d.d;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];save();render();return}
 if(d.term){const i=S.terms.indexOf(d.term);if(i>=0)S.terms.splice(i,1);else{if(S.terms.length>=2){toast('두 개만 고를 수 있어요');return}S.terms.push(d.term)}save();render();return}
 if(b.id==='copy'){const tx=$('#copytxt'),v=tx.value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('복사했어요')).catch(()=>{tx.focus();tx.select();toast('선택된 글을 Ctrl+C로 복사하세요')});return}
 if(b.id==='restart'){if(d.sure){S=blank();save();render();toast('새 수업을 시작해요')}else{d.sure='1';b.textContent='한 번 더 누르면 지워져요'}return}
});
function onField(e){const t=e.target;
 if(t.id==='tname'){S.name=t.value;save();return}
 if(t.id==='tno'){S.no=t.value;save();return}
 if(t.id==='tfilter'){if(e.type==='change'){R.filter=t.value;render()}return}
 if(t.dataset.k){S.v[t.dataset.k]=t.value;if(t.tagName==='INPUT')t.classList.toggle('filled',!!t.value.trim());save();renderChecks()}}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
if(S.step>0&&!S.topic)S.step=0;
if(S.step>=4&&!S.act)S.step=3;
document.addEventListener('submit',e=>{if(e.target.id==='tlogin'){e.preventDefault();R.pw=$('#tpw').value.trim();if(R.pw||!SHEET_URL)tEnter()}});
window.addEventListener('hashchange',()=>{R.teacher=location.hash==='#teacher';R.open=null;render();window.scrollTo({top:0})});
if(R.teacher){try{R.pw=sessionStorage.getItem('tl-tpw')||''}catch(e){}if(R.pw)tEnter()}
render();
</script>

</body></html>
